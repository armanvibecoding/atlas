# Atlas ana yapılandırması. Göreli yollar ATLAS_HOME'a (varsayılan: repo kökü) göredir.

[paths]
journal = "var/journal.sqlite"
store = "var/data"
registry = "var/registry.sqlite"

[account]
# Hedef prop config'i (configs/props altında). Boş alanları ARMAN doldurur.
prop = "props/generic_100k.toml"

[data]
# Databento çekim başına USD tavanı. ARMAN DOLDURUR. Boşken her ücretli çekim onay ister (tavan = 0).
max_usd_per_pull = ""

[verify]
# M1 doğrulamalarında kullanılan sabit seed (determinizm).
seed = 20261031

# Atlas'ın kendi risk politikası (firmadan bağımsız). Yalnız sıkılaştırılabilir.
# Arman onayı 2026-10-31 (işlem başı risk %1). Gevşetme = insan onayı.
[risk]
cooldown_after_stop_minutes = 15
max_risk_per_trade_usd = "1000"   # Arman onayı 2026-10-31: hesabın %1'i (100k)
max_group_net_contracts = "2"
consistency_headroom = "0.8"
drawdown_near = "0.25"
stop_slippage_buffer_ticks = 2
min_minutes_before_week_close = 60

# Gauntlet (§4.6). Spec varsayılanları geçerlidir; burada yalnız SIKILAŞTIRMA kabul edilir.
# prop_pass_min / prop_bust_max eşikleri Arman'ındır — ÖNERİ, onay bekliyor (OPEN_QUESTIONS #13).
[gauntlet]
prop_pass_min = 0.50
prop_bust_max = 0.20
holdout_days = 90
holdout_budget = 5

# ---------------- M3 ----------------
# Grok'un alarm webhook'u. Boşken olaylar diskte bekler (kaybolmaz); health uyarı verir.
[webhook]
url = ""

# Uyandırma politikası (§5): sessiz saat 23:30–09:00 TSİ, saatte en fazla 6 uyandırma, gece özeti 09:00.
[wake]
tz = "Europe/Istanbul"
quiet_from = "23:30"
quiet_to = "09:00"
max_wakes_per_hour = 6
dedupe_minutes = 30
digest_at = "09:00"

# LLM ajanları. Sağlayıcı + fiyat + günlük bütçe dolmadan HİÇBİR çağrı yapılmaz (sistem mekanik çalışır).
[agents]
provider = "none"            # anthropic | xai | none
model = ""                   # ör. claude-opus-5-5
input_usd_per_mtok = ""      # ARMAN DOLDURUR — sağlayıcının güncel fiyatı
output_usd_per_mtok = ""     # ARMAN DOLDURUR
daily_usd = "0"              # ARMAN DOLDURUR — günlük tavan
daily_tokens = 0
research_every_minutes = 60
hypotheses_per_cycle = 2

[search]
screen_days = 60
min_screen_trades = 60
screen_t_min = 2.0
population = 40
evals_per_cycle = 4
risk_usd = 1000
dead_idea_distance = 0.05

[daemon]
symbols = ["BTCUSDT"]
heartbeat_minutes = 5
search_every_minutes = 1
persist_every_minutes = 60
checkpoint_every_minutes = 60
warmup_days = 3
max_clock_skew_ms = 2000

# Arman'ın onay anahtarının SHA-256'sı (hex). Boşsa `atlas approve` kapalı.
# Üret: echo -n 'GİZLİ-ANAHTAR' | sha256sum ; anahtar ATLAS_APPROVER_KEY ortam değişkeninde (yalnız Arman'da).
[approvals]
key_sha256 = ""
