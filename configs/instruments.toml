# Enstrüman tanımları.
# - tick_size / tick_value / lot_size: borsa kontrat spesifikasyonu. Binance değerleri her çekimde
#   exchangeInfo ile otomatik doğrulanır (uyuşmazsa çekim durur).
# - costs: UYDURULMAZ. Boş alan = doldurulmadı → bu enstrümanla simülasyon/RiskGate açık hata verir.
# - exposure_group / exposure_weight: net maruziyet ve ağırlıklı kontrat sayımı (mini=1, mikro=0.1).

# ---- CME (kaynak: CME kontrat spesifikasyonları — teyit edilecek, OPEN_QUESTIONS #4) ----
[[instrument]]
symbol = "NQ"
venue = "cme"
kind = "future"
tick_size = "0.25"
tick_value_usd = "5"
session = "cme_globex"
exposure_group = "us_equity_tech"
exposure_weight = "1"
[instrument.costs]
commission_per_contract_usd = ""    # ARMAN DOLDURUR — broker/firma ücreti
exchange_fee_per_contract_usd = ""  # ARMAN DOLDURUR
slippage_ticks = ""                 # kalibrasyonla ölçülecek (M4); şimdilik boş

