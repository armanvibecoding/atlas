# ---- Binance USDⓈ-M perpetual (ücretsiz veri). 1 lot = lot_size kadar dayanak. ----
# tick_value = tick_size × lot_size (BTC: 0.1 × 0.001 = 0.0001 USDT ≈ USD varsayımı, OPEN_QUESTIONS #5)
[[instrument]]
symbol = "BTCUSDT"
venue = "binance"
kind = "perpetual"
tick_size = "0.1"
tick_value_usd = "0.0001"
lot_size = "0.001"
session = "always"
exposure_group = "crypto_btc"
exposure_weight = "0.001"
[instrument.costs]
fee_rate_percent = "0.05"  # Binance VIP0 taker (yayımlanmış tablo) — teyit: OPEN_QUESTIONS #5
slippage_ticks = ""        # kalibrasyonla ölçülecek

