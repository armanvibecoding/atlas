# Enstrüman tanımları.
# - tick_size / tick_value / lot_size: borsa kontrat spesifikasyonu. Binance değerleri her çekimde
#   exchangeInfo ile otomatik doğrulanır (uyuşmazsa çekim durur).
# - costs: TEK YÖN (giriş veya çıkış), kontrat başına. Kaynaklar aşağıda; 2026-10-31'de internetten teyit.
# - exposure_group / exposure_weight: net maruziyet ve ağırlıklı kontrat sayımı (mini=1, mikro=0.1).
#
# CME maliyet modeli (genel/perakende, belirli bir prop firması değil):
#   commission_per_contract = aracı komisyonu + takas (clearing) ücreti
#       NinjaTrader "Free" planı (resmi fiyat sayfası, 2026-07-01 tarifesi): standart $1.29, mikro $0.39
#       + takas $0.19 (NinjaTrader'ın resmi maliyet örneği, 2026-08-14) → standart $1.48, mikro $0.58
#   exchange_fee_per_contract = CME borsa ücreti (üye olmayan) + NFA $0.02
#       NQ/MNQ: TradeStation ve Interactive Brokers ücret tabloları ($1.38 / $0.35)
#       ES/MES/GC/MGC: Topstep ücret tablosu (2026; gidiş-dönüş $2.76/$0.70/$3.30/$1.40 → tek yön yarısı)
#       CL: NexusFi 2026 başı tahmini ($1.42) — daha zayıf kaynak, ilk fırsatta CME Fee Finder'dan teyit
# - slippage_ticks: internetten teyit edilemez, ÖLÇÜLÜR. Binance: ölçüldü (1 tick). CME: veri yok, boş (sim hata verir).

# ---- CME (tick değerleri: CME + birden çok aracı kurum sayfasıyla teyit, 2026-10-31) ----
[[instrument]]
symbol = "NQ"
venue = "cme"
kind = "future"
tick_size = "0.25"
tick_value_usd = "5"
session = "cme_globex"
exposure_group = "us_equity_tech"
exposure_weight = "1"
[instrument.costs]
commission_per_contract_usd = "1.48"
exchange_fee_per_contract_usd = "1.40"
slippage_ticks = ""

