# ---- Binance USDⓈ-M perpetual (ücretsiz veri). 1 lot = lot_size kadar dayanak. ----
# tick_value = tick_size × lot_size (BTC: 0.1 × 0.001 = 0.0001 USDT; 1 USDT = 1 USD kabul)
# Ücret: normal kullanıcı (VIP 0) taker %0.05 / maker %0.02 — Binance resmi destek makalesi
# 360033544231 ile teyit (2026-10-31). Karamsar olmak için tüm dolumlar taker sayılır.
[[instrument]]
symbol = "BTCUSDT"
venue = "binance"
kind = "perpetual"
tick_size = "0.1"
tick_value_usd = "0.0001"
lot_size = "0.001"
session = "always"
exposure_group = "crypto_btc"
exposure_weight = "0.001"
[instrument.costs]
fee_rate_percent = "0.05"
slippage_ticks = "1"   # ÖLÇÜLDÜ 2026-10-31: atlas data measure-slippage (aggTrades, 200 pencere/24 sa), yarım spread ort. yukarı yuvarlandı

