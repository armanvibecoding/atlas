[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/risk",
    "crates/journal",
    "crates/data",
    "crates/sim",
    "crates/features",
    "crates/genome",
    "crates/registry",
    "crates/gauntlet",
    "crates/plugin",
    "bins/atlas",
]
# WASM eklenti kaynakları ayrı crate'lerdir (wasm32 hedefi); workspace üyesi değildir.
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
atlas-core = { path = "crates/core" }
atlas-risk = { path = "crates/risk" }
atlas-journal = { path = "crates/journal" }
atlas-data = { path = "crates/data" }
atlas-sim = { path = "crates/sim" }
atlas-features = { path = "crates/features" }
atlas-genome = { path = "crates/genome" }
atlas-registry = { path = "crates/registry" }
atlas-gauntlet = { path = "crates/gauntlet" }
atlas-plugin = { path = "crates/plugin" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
statrs = "0.18"
rayon = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
tempfile = "3"
# Plugin sandbox (ADR 0004): yalnız derleyici + çalışma zamanı + WAT. WASI, async, GC, bileşen modeli yok.
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
debug = 1

[profile.test]
opt-level = 2
