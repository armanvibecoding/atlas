# /etc/logrotate.d/atlas — daemon günlüğü journald'a gider; bu dosya ek metin günlükleri ve
# teslim edilmiş outbox kopyalarının büyümesini sınırlar. Journal (SQLite) ASLA döndürülmez/silinmez.
/opt/atlas/var/log/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
