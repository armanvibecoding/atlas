# nginx şablonu — Atlas MCP (ADR 0009). <MCP_HOST> sunucuya özgüdür (repo'da yazılmaz).
# Kurulum: sed "s/<MCP_HOST>/gercek.alan.adi/" bu dosya > /etc/nginx/sites-available/atlas-mcp
#          ln -s ../sites-available/atlas-mcp /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#          certbot --nginx -d <MCP_HOST>     (yalnız bu server bloğunu düzenler)
# Hız sınırı bölgesi http bağlamında: /etc/nginx/conf.d/atlas-mcp-limit.conf
#   limit_req_zone $binary_remote_addr zone=atlas_mcp:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name <MCP_HOST>;

    # Yalnız MCP uç noktası; geri kalan her şey 404.
    location = /mcp {
        limit_req zone=atlas_mcp burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8790/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        # verify (m2) sunucuda dakikalar sürebilir.
        proxy_read_timeout 960s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
